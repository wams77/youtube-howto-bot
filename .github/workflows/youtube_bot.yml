name: YouTube Shorts History Bot (Auto 3x Sehari WITA)

on:
  schedule:
    # Jadwal otomatis untuk WITA (UTC+8):
    # - Pukul 07:00 WITA -> 23:00 UTC (hari sebelumnya)
    # - Pukul 12:00 WITA -> 04:00 UTC
    # - Pukul 18:00 WITA -> 10:00 UTC
    - cron: '0 23,4,10 * * *'
  
  workflow_dispatch:     # Memungkinkan Anda menjalankan bot secara manual kapan saja dari tab Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        sudo apt-get update
        sudo apt-get install -y imagemagick
        # Membuka izin kebijakan keamanan ImageMagick untuk merender teks kustom
        sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml
        pip install -r requirements.txt

    - name: Run Bot Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      run: |
        python main.py
