name: YouTube Shorts History Bot

on:
  schedule:
    - cron: '0 8 * * *' # Berjalan otomatis setiap jam 08:00 UTC
  workflow_dispatch:     # Memungkinkan Anda menekan tombol "Run workflow" secara manual

jobs:
  generate-video-assets:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        sudo apt-get update
        sudo apt-get install -y imagemagick
        # PERBAIKAN: Membuka izin kebijakan keamanan ImageMagick untuk membaca file teks sementara
        sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml
        pip install -r requirements.txt

    - name: Run Bot Script (Gemini & Pexels)
      env:
        # Menarik API Key dari GitHub Secrets ke dalam Environment Bot
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      run: |
        python main.py

    - name: Upload Output (JSON & MP4) as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: youtube-shorts-assets
        path: |
          script_data.json
          background_shorts.mp4
        retention-days: 7 # File akan otomatis terhapus dari server setelah 7 hari
